[package]
name = "qntz"
version = "0.1.6"
edition = "2021"
rust-version = "1.80"
authors = ["Arc <attobop@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Vector quantization primitives (RaBitQ, ternary, bit packing) for ANN systems."
repository = "https://github.com/arclabs561/qntz"
homepage = "https://github.com/arclabs561/qntz"
documentation = "https://docs.rs/qntz"
keywords = ["quantization", "vector-search", "ann", "pq", "compression"]
categories = ["algorithms", "science"]

[workspace]

[dependencies]
thiserror = "2.0"
innr = { version = "0.2.4", optional = true }

[features]
default = []
simd = ["dep:innr"]
rabitq = []
ternary = []
distquant = []
adaptive = []
binary = []

[dev-dependencies]
ans = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.9"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1

[[bench]]
name = "quantization"
path = "benches/quantization.rs"
harness = false

[[example]]
name = "entropy_coded_quantization"
path = "examples/entropy_coded_quantization.rs"
required-features = ["rabitq"]
