[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "qntz"
version = "0.1.3"
description = "Vector quantization: RaBitQ (1-bit), ternary quantization, bit packing, and Hamming distance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Arc", email = "attobop@gmail.com" }]
keywords = ["quantization", "rabitq", "vector-search", "ann", "compression"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/arclabs561/qntz"
Documentation = "https://docs.rs/qntz"
Repository = "https://github.com/arclabs561/qntz"

[project.optional-dependencies]

[tool.maturin]
module-name = "qntz"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../Cargo.toml" },
    { file = "../src/**/*.rs" },
    { file = "src/**/*.rs" },
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]
